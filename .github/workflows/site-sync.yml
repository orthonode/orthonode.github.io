name: SEO Audit

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "sitemap.xml"
      - "robots.txt"

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run SEO/GEO audit
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run /site-seo to audit all HTML pages in this repo for SEO and GEO compliance.

            Check every HTML page for:
            - <title> tag present and unique (format: "[Name] | ORTHONODE SYSTEMS™")
            - <meta name="description"> present, 120-160 characters
            - <link rel="canonical"> present and correct
            - <meta name="author" content="Arhant Barmate"> present
            - <meta name="robots" content="index, follow"> present
            - Open Graph tags complete
            - Twitter Card tags complete
            - JSON-LD structured data present
            - Mobile viewport meta tag present
            - <h1> exists exactly once per page
            - No $49,000 grant figure (SHA grant is $25,000)
            - SHA contract: 0xD661a1aB8CEFaaCd78F4B968670C3bC438415615

            Output results in format:
            CHECK: [name]
            STATUS: PASS / FAIL
            FILE: [filename:line if FAIL]
            DETAIL: [exact issue]

            Print: "X/Y checks PASS — [N] FAIL items"

            If any FAIL items exist, list them clearly so they can be fixed in the next commit.
            Do NOT modify any files — audit only.
